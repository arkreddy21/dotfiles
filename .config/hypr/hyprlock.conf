label { # Status (battery)
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/battery_status.sh
    text_align = center
    color = $text_color
    font_size = 18
    font_family = $font_family

    position = 0, -180
    halign = center
    valign = top
}
