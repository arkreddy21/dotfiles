
# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

###############################################
# This sources other files in `hyprland` folder
$qsConfig = ii
source=~/.config/hypr/hyprland/env.conf
source=~/.config/hypr/hyprland/execs.conf
source=~/.config/hypr/hyprland/rules.conf
source=~/.config/hypr/hyprland/keybinds.conf
source=~/.config/hypr/themes/latte.conf
###############################################


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor = name, resolution, position, scale
monitor=eDP-1, 1920x1080, auto, 1
monitor = , preferred, auto, 1, #mirror, eDP-1  ## mirror display


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables

general {
  layout = dwindle
	gaps_in = 2
  gaps_out = 4
  border_size = 2
  gaps_workspaces = 50
  # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
  col.active_border = $mauve  # catppuccin
  col.inactive_border = rgba($crustAlphaaa)
  # Set to true enable resizing windows by clicking and dragging on borders and gaps
  resize_on_border = true
  no_focus_fallback = true
  # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
  allow_tearing = false # This just allows the `immediate` window rule to work
  snap {
    enabled = true
  }
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
  rounding = 12
  # Change transparency of focused and unfocused windows
  active_opacity = 1.0
  inactive_opacity = 1.0
  # Dim
  dim_inactive = false
  dim_strength = 0.2
  dim_special = 0.5

	#shadow {
	#	drop_shadow = true
	#	shadow_range = 4
	#	shadow_render_power = 3
  #	col.shadow = rgba(1a1a1aee)
  #	shadow_offset = 0 2
	#}

  # https://wiki.hyprland.org/Configuring/Variables/#blur
  blur {
    enabled = true
    xray = true
    special = false
    size = 14
    passes = 4
    brightness = 1
    noise = 0.01
    contrast = 1
    popups = true
    popups_ignorealpha = 0.6
  }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Animation curves
    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.52, 0.03, 0.72, 0.08

    # Animation configs
    animation = windows, 1, 2, md3_decel, popin 60%
    animation = border, 1, 10, md3_decel

    animation = workspaces, 1, 2, md3_decel, slidefade 15%
    animation = specialWorkspace, 1, 2, md3_decel, slidefadevert 15%

    animation = layers, 1, 1.5, md3_decel, popin 60%
    animation = fade, 1, 2, md3_decel
    animation = fadeLayersIn, 1, 0.5, menu_decel
    animation = fadeLayersOut, 1, 0.5, menu_accel
}

group {
	col.border_active = rgb(04a5e5)
	col.border_inactive = rgba(dce0e8aa)
	groupbar {
		col.active = $lavender
		col.inactive = $overlay2
		col.locked_active = rgba(89b4faff)
		col.locked_inactive = rgba(dce0e8aa)
		render_titles = true
		rounding = 4
		round_only_edges = false
		font_size = 13
		font_family = Hack
		font_weight_active = bold
		font_weight_inactive = bold
		text_color = rgb(000000)
		text_padding = 16
		#indicator_height = 4
        indicator_height = 22  # Make the indicator tall enough to render text inside
        text_offset = -11  # about half the indicator height
        height = 1
        scrolling = false
	}
}

###############
### LAYOUTS ###
###############

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
	preserve_split = true
	pseudotile = true
	smart_split = false
	smart_resizing = false
}

master {
  #new_status = slave
  mfact = 0.6
}

workspace = 1, layout:master
workspace = special:magic, layout:scrolling

scrolling {
  column_width = 0.6
  focus_fit_method = 1
  follow_focus = true
}

#############
### INPUT ###
#############

binds {
    scroll_event_delay = 0
}

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:swapescape
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        scroll_factor = 1
        drag_lock = 0  # 1: delay, 2: sticky
    }
}

# per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
	name = bluetooth-mouse-m336/m337/m535-mouse
	sensitivity = -0.3
}

# https://wiki.hyprland.org/Configuring/Gestures
gesture = 3, horizontal, workspace
gesture = 4, horizontal, workspace
gesture = 3, vertical, special, magic
gesture = 4, vertical, fullscreen

############
### MISC ###
############

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
	mouse_move_enables_dpms = true #switch to false to prevent accidental wake up
	key_press_enables_dpms = true

	font_family = Rubik

    vfr = 1
    vrr = 1
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    enable_swallow = false
    swallow_regex = (foot|kitty|allacritty|Alacritty)

    on_focus_under_fullscreen = 2
    allow_session_lock_restore = true

    # initial_workspace_tracking = 1
    focus_on_activate = true
}

debug {
	disable_logs = false
}

# Overview
plugin {
    hyprexpo {
        columns = 3
        gap_size = 12
        bg_col = rgb(000000)
        workspace_method = first 1 # [center/first] [workspace] e.g. first 1 or center m+1
    }
}
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


