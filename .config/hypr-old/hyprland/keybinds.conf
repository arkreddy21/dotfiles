
# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER
# Set programs that you use
$terminal = kitty
$fileManager = nautilus /home/arkreddy/Documents/Books/Masters
$browser = zen-browser
$menu = rofi -show drun
# $ipc = qs -c noctalia-shell ipc call
# $menu = $ipc launcher toggle
$taskmanager = kitty -e btop


###############################################################################
##! Actions

bind = $mainMod, slash, exec, killall -SIGUSR1 waybar
bind = Ctrl+Alt, Delete, exec, wlogout -p layer-shell

bind = $mainMod, X, killactive,
bind = $mainMod ALT, M, exit,

bind = SUPER_ALT, L, exec, loginctl lock-session
bind = SUPER_ALT_SHIFT, L, exec, systemctl suspend

bind = $mainMod, T, togglegroup
bind = $mainMod, G, changegroupactive
bind = $mainMod ALT, G, changegroupactive, b

# Screenshot edit
bind = Super+Shift+Alt, S, exec, grim -g "$(slurp)" - | swappy -f - # Screen snip >> edit
# OCR
bind = Ctrl+Shift, Print, exec,grim -g "$(slurp $SLURP_ARGS)" "tmp.png" && tesseract -l eng "tmp.png" - | wl-copy && rm "tmp.png" # Screen snip to text >> clipboard
# Color picker
bind = Super+Shift, C, exec, hyprpicker -a # Pick color (Hex) >> clipboard
# Recording stuff
bindd = Super+Alt, R, Record screen (with sound), exec, ~/.config/hypr/hyprland/scripts/record.sh --fullscreen-sound # Record screen (with sound)
bindd = Super+Shift, R, Record screen (no sound), exec, ~/.config/hypr/hyprland/scripts/record.sh --fullscreen  # Record screen (no sound)
bindd = Super+Shift+Ctrl, R, Record region (no sound), exec, ~/.config/hypr/hyprland/scripts/record.sh # Record region (no sound)
# Screenshots
bind = , Print, exec, hyprshot -m region  # Screenshot a region
bind = CTRL, Print, exec, hyprshot -m region --clipboard-only  # Screenshot a region to clipboard only
bind = SUPER, Print, exec, hyprshot -m window  # Screenshot a window
bind = SUPER_CTRL, Print, exec, hyprshot -m window --clipboard-only  # Screenshot a window to clipboard only
bind = ALT, Print, exec, hyprshot -m output -m eDP-1  # Screenshot entire screen
bind = ALT_CTRL, Print, exec, hyprshot -m output -m eDP-1 --clipboard-only  # Screenshot entire screen to clipboard only


##################################################################################
#!
##! Window management

#/# bind = Super+Shift, ←/↑/→/↓,, # Window: move in direction
bind = Super+Shift, Left, swapwindow, l 
bind = Super+Shift, Right, swapwindow, r 
bind = Super+Shift, Up, swapwindow, u 
bind = Super+Shift, Down, swapwindow, d 

#/# bind = Super, ←/↑/→/↓,, # Focus in direction
bind = Super, Left, movefocus, l 
bind = Super, Right, movefocus, r 
bind = Super, Up, movefocus, u 
bind = Super, Down, movefocus, d 
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Window split ratio
binde = Super, Semicolon, layoutmsg, splitratio -0.1 # Dwindle
binde = Super, Apostrophe, layoutmsg, splitratio +0.1
binde = Super, Semicolon, layoutmsg, mfact -0.1 # For Master layout
binde = Super, Apostrophe, layoutmsg, mfact +0.1

# Positioning mode
bind = Super, F, fullscreen, 0
bind = Super, D, fullscreen, 1  # maximize
bind = Super+Alt, Space, togglefloating
bind = Super, P, pin # Pin
bind = $mainMod, B, layoutmsg, togglesplit # dwindle
bind = $mainMod, B, layoutmsg, swapwithmaster # master
# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
# bindm = $mainMod, mouse:273, resizewindow
bindm=SUPER_CTRL, mouse:272, resizewindow

#!
##! Workspace management

# special workspace
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1 
bind = $mainMod, 2, workspace, 2 
bind = $mainMod, 3, workspace, 3 
bind = $mainMod, 4, workspace, 4 
bind = $mainMod, 5, workspace, 5 
bind = $mainMod, 6, workspace, 6 
bind = $mainMod, 7, workspace, 7 
bind = $mainMod, 8, workspace, 8 
bind = $mainMod, 9, workspace, 9 
bind = $mainMod, 0, workspace, 10 

bind = $mainMod+Alt, 1, workspace, 11 
bind = $mainMod+Alt, 2, workspace, 12 
bind = $mainMod+Alt, 3, workspace, 13 
bind = $mainMod+Alt, 4, workspace, 14 
bind = $mainMod+Alt, 5, workspace, 15 
bind = $mainMod+Alt, 6, workspace, 16 
bind = $mainMod+Alt, 7, workspace, 17 
bind = $mainMod+Alt, 8, workspace, 18 
bind = $mainMod+Alt, 9, workspace, 19 
bind = $mainMod+Alt, 0, workspace, 20 

#/# bind = Super+Shift, Hash,, # Window: move to workspace # (1, 2, 3, 4, ...) and focus
bind = $mainMod SHIFT, 1, movetoworkspace, 1 
bind = $mainMod SHIFT, 2, movetoworkspace, 2 
bind = $mainMod SHIFT, 3, movetoworkspace, 3 
bind = $mainMod SHIFT, 4, movetoworkspace, 4 
bind = $mainMod SHIFT, 5, movetoworkspace, 5 
bind = $mainMod SHIFT, 6, movetoworkspace, 6 
bind = $mainMod SHIFT, 7, movetoworkspace, 7 
bind = $mainMod SHIFT, 8, movetoworkspace, 8 
bind = $mainMod SHIFT, 9, movetoworkspace, 9 
bind = $mainMod SHIFT, 0, movetoworkspace, 10 

bind = $mainMod+Alt+SHIFT, 1, movetoworkspace, 11 
bind = $mainMod+Alt+SHIFT, 2, movetoworkspace, 12 
bind = $mainMod+Alt+SHIFT, 3, movetoworkspace, 13 
bind = $mainMod+Alt+SHIFT, 4, movetoworkspace, 14 
bind = $mainMod+Alt+SHIFT, 5, movetoworkspace, 15 
bind = $mainMod+Alt+SHIFT, 6, movetoworkspace, 16 
bind = $mainMod+Alt+SHIFT, 7, movetoworkspace, 17 
bind = $mainMod+Alt+SHIFT, 8, movetoworkspace, 18 
bind = $mainMod+Alt+SHIFT, 9, movetoworkspace, 19 
bind = $mainMod+Alt+SHIFT, 0, movetoworkspace, 20 

#/# bind = Super+Alt, Hash,, # Window: move to workspace # (1, 2, 3, 4, ...)
bind = Super+Ctrl+Shift, 1, movetoworkspacesilent, 1 
bind = Super+Ctrl+Shift, 2, movetoworkspacesilent, 2 
bind = Super+Ctrl+Shift, 3, movetoworkspacesilent, 3 
bind = Super+Ctrl+Shift, 4, movetoworkspacesilent, 4 
bind = Super+Ctrl+Shift, 5, movetoworkspacesilent, 5 
bind = Super+Ctrl+Shift, 6, movetoworkspacesilent, 6 
bind = Super+Ctrl+Shift, 7, movetoworkspacesilent, 7 
bind = Super+Ctrl+Shift, 8, movetoworkspacesilent, 8 
bind = Super+Ctrl+Shift, 9, movetoworkspacesilent, 9 
bind = Super+Ctrl+Shift, 0, movetoworkspacesilent, 10 

#/# bind = Super, Page_↑/↓,, # Workspace: focus left/right
bind = Super, Page_Down, workspace, r+1 
bind = Super, Page_Up, workspace, r-1 

#/# bind = Super+Shift, Page_↑/↓,, # Window: move to workspace left/right
bind = Super+Shift, Page_Down, movetoworkspace, r+1  
bind = Super+Shift, Page_Up, movetoworkspace, r-1  
bind = Super+Alt, Page_Down, movetoworkspacesilent, r+1 
bind = Super+Alt, Page_Up, movetoworkspacesilent, r-1 

