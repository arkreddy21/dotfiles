##################################################################################
#!
##! Apps
bind = $mainMod, R, exec, $menu  # Launch App Menu

bind = $mainMod, I, exec, XDG_CURRENT_DESKTOP="gnome" gnome-control-center # Launch GNOME Settings
bind = Ctrl+Shift, Escape, exec, $taskmanager # Launch task manager
bind = $mainMod, E, exec, $fileManager # Launch File Manager
bind = $mainMod, Z, exec, /opt/zen-browser-bin/zen-bin  # Launch Zen Browser
bind = $mainMod, O, exec, obsidian
bind = $mainMod, return, exec, $terminal
bind = $mainMod, Equal, exec, speedcrunch
bind = $mainMod, backslash, exec, zeditor  # Text editor

bind = $mainMod, N, exec, swaync-client -t # Notification panel

bind = $mainMod, slash, exec, $ipc bar toggle
bind = $mainMod, grave, hyprexpo:expo, toggle

#### MISC ########################################################
# Clipboard manager - clipse
bind = $mainMod, V, exec,  kitty --class clipse -e 'clipse'
# character selector
bind = SUPER, Period, exec, flatpak run org.gnome.Characters

# Audio stuff
bindl = $mainMod, XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bindel =, XF86AudioRaiseVolume, exec, swayosd-client --output-volume 5 #wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bindel =, XF86AudioLowerVolume, exec, swayosd-client --output-volume -5 #wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-
bindl =, XF86AudioMute, exec, swayosd-client --output-volume mute-toggle #wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Brightness (600 = 5% in hp laptop). 
#bind = ,XF86MonBrightnessDown,exec, swayosd-client --brightness -2 #brightnessctl set 600-
#bind = ,XF86MonBrightnessUp,exec, swayosd-client --brightness +2  #brightnessctl set +600
# bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
# bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease

## Fixes brightness keypresses firing twice
# Brightness Up
bind = , XF86MonBrightnessUp, exec, flock -n /tmp/swayosd_brightness.lock -c 'swayosd-client --brightness +5 && sleep 0.1'
# Brightness Down
bind = , XF86MonBrightnessDown, exec, flock -n /tmp/swayosd_brightness.lock -c 'swayosd-client --brightness -5 && sleep 0.1'


