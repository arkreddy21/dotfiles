# Fonts
font_family      Hack Nerd Font
font_size        13
bold_font        auto
italic_font      auto
bold_italic_font auto

tab_bar_edge top
# tab_bar_style  powerline
# tab_powerline_style  round
# tab_separator  " | "
tab_fade 0.5 0.75 1 1

# scrollback_pager nvim -c 'setlocal nonumber nolist showtabline=0 foldcolumn=0|Man!' -c "autocmd VimEnter * normal G" -

# scrollback_pager nvim --clean -c "setlocal nonumber nolist showtabline=0 foldcolumn=0 laststatus=0 ignorecase smartcase" -c "nnoremap q :qa!<CR>" -c "call nvim_open_term(0, {})" +'$' -
scrollback_pager nvim --clean -c "set termguicolors | setlocal nonumber nolist showtabline=0 foldcolumn=0 laststatus=0 ignorecase smartcase" -c "nnoremap q :qa!<CR>" -c "autocmd TermOpen * setlocal winhl=Normal:KittyPager | highlight KittyPager guibg=#1e1e2e" -c "call nvim_open_term(0, {})" +'$' -


clipboard_control write-clipboard read-clipboard

enable_audio_bell no

#scrollbar_width 0.8
#scrollbar_radius 0.5
#scrollbar_gap 0.3


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

### Keybinds ###
map ctrl+shift+r load_config_file

map ctrl+left previous_tab
map ctrl+right next_tab
map ctrl+shift+left move_tab_backward
map ctrl+shift+right move_tab_forward

enabled_layouts splits
map ctrl+= launch --location=hsplit
map ctrl+\ launch --location=vsplit

map ctrl+shift+f scroll_page_down
map ctrl+shift+b scroll_page_up
map ctrl+/ show_scrollback

map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down

# conflicts with word navigation
#map alt+left neighboring_window left
#map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

map ctrl+alt+0 resize_window reset

map ctrl+; resize_window narrower 5
map ctrl+' resize_window wider 5
map ctrl+alt+; resize_window shorter 5
map ctrl+alt+' resize_window taller 5